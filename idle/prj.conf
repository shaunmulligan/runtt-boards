# runtt-idle: what ships in slot 0 at provisioning time.
#
# Its whole job is to make a freshly provisioned board VISIBLE. It enumerates,
# answers describe, accepts an image, and otherwise does nothing.

# Says "this is the provisioning placeholder, not the customer's firmware", so
# the runtime can report a board awaiting its first release as exactly that
# rather than as unrecognised firmware.
CONFIG_RUNTT_IDLE=y

# Deliberately minimal: this image is replaced by the first real deploy, so
# every byte it occupies is wasted flash and a slower provisioning write.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_MAIN_STACK_SIZE=1024
