# A bench diagnostic, not a deliverable.
#
# Built WITHOUT the runtt snippet on purpose, so the console stays on the
# board's default UART and can be read through a debug probe's UART bridge --
# which is the only channel available when the thing you are debugging is a
# bootloader that has no USB.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_MAIN_STACK_SIZE=2048
