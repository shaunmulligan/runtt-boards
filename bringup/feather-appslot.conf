# Track A: the real USB dual-CDC configuration, but linked into the Adafruit
# application slot instead of over the bootloader.
#
# Everything else -- the two CDC-ACM channels, the interface string descriptors,
# hw-flow-control on management only -- comes from the snippet's Feather board
# section, so this is the shipping configuration minus MCUboot.
#
# 0x26000 is where the Adafruit stack expects an application. Linking here keeps
# the MBR, the SoftDevice and the UF2 bootloader intact, so USB enumeration and
# the udev rules can be proven before making the destructive decision.
CONFIG_FLASH_LOAD_OFFSET=0x26000
