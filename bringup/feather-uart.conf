# Feather bring-up over the probe's UART bridge.

# One wire carries both SMP and log output. The runtime demultiplexes them by
# the console transport's framing markers -- see crates/smp-client/src/demux.rs.
CONFIG_RUNTT_CHANNELS=1

# No USB at all in this configuration.
CONFIG_RUNTT_USB=n
CONFIG_USB_DEVICE_STACK_NEXT=n

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y

# Link above the Adafruit bootloader's MBR and SoftDevice rather than at 0x0, so
# bring-up does not destroy the UF2 bootloader. 0x26000 is where the Adafruit
# stack expects an application. Replacing MCUboot at 0x0 is a separate, and
# genuinely destructive, decision.
CONFIG_FLASH_LOAD_OFFSET=0x26000
