# Per-board sysbuild override for ESP32-S3, passed as -DSB_EXTRA_CONF_FILE so it
# merges AFTER sysbuild-common.conf and its choice assignment wins.
#
# The common file pins SWAP_USING_OFFSET for every board, and MCUboot carves
# ESP32 out of that mode deliberately: BOOT_PREFER_SWAP_OFFSET is
# `default y if ... && !SOC_FAMILY_ESPRESSIF_ESP32`, and Espressif's own
# partition table (partitions_0x0_amp) ships a scratch_partition. Scratch is the
# supported mode on this SoC, so it is pinned here EXPLICITLY -- the same rule
# as the common file: a bootloader built for one mode cannot boot an image
# built for the other, so the mode must never be inherited from a default that
# can move under a Zephyr bump.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=n
SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
