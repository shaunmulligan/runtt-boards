# Patches applied to west modules on top of their pinned revisions.
#
# Deliberately a patch set rather than a fork: `west update` restores upstream,
# and `west patch apply` re-applies this. The only thing maintained here is the
# diff, which should disappear once the fix lands upstream.
#
#   west patch apply -l patches.yml -b patches
#
# Verify with `west patch list`; `west patch clean` reverts modules to their
# pinned revision.
