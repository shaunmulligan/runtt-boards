# West manifest for the runtt firmware side.
#
# Zephyr is pinned to an exact tag, never a branch. Minor releases have already
# moved behaviour under this project twice: the flash simulator's
# erase-at-start default changed between 4.3 and 4.4, and MCUboot's swap mode
# default became swap-using-offset. A bump is a deliberate, tested step.
manifest:
  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos
    - name: runtt
      url-base: https://github.com/shaunmulligan

  projects:
    - name: zephyr
      remote: upstream
      revision: v4.4.2
      import:
        # Only what we actually build for: native_sim needs no HAL, and the
        # hardware targets are nRF52840 and RP2040.
        name-allowlist:
          # zcbor is not optional: MCUmgr's root Kconfig symbol depends on it,
          # and without it CONFIG_MCUMGR silently does not exist rather than
          # failing loudly.
          - zcbor
          - cmsis
          - cmsis_6
          - hal_espressif
          - hal_nordic
          - hal_rpi_pico
          - mcuboot
          - picolibc
          - segger
          # MCUboot's signing and crypto for the hardware targets.
          # tf-psa-crypto is NOT optional alongside mbedtls: since mbedtls 4.x it
          # is a separate repository rather than a subdirectory, and without it
          # mbedtls's CMakeLists fails with "tf-psa-crypto is not an existing
          # directory". Same trap as zcbor -- an allowlist that looks complete.
          - mbedtls
          - tf-psa-crypto
          - tinycrypt

    # The device half of the wire contract. Declared here rather than reached
    # with ZEPHYR_EXTRA_MODULES: west registers it as a Zephyr module
    # automatically, so `west build` finds its Kconfig, CMakeLists and snippet
    # with no extra flags. That is the whole point of it being a west module.
    #
    # `revision` is a branch while the project is pre-1.0. Pin a tag before
    # anyone depends on a provisioning image built from here, or a module commit
    # can change what a released image contains.
    - name: runtt-zephyr-module
      remote: runtt
      revision: main
      path: modules/runtt

  self:
    # Where this repository sits inside the workspace. It was `firmware` when
    # this manifest lived in a monorepo subdirectory; standing alone it is the
    # manifest repo itself, so a workspace looks like:
    #
    #   ws/boards/        <- this repository
    #   ws/zephyr/
    #   ws/modules/runtt/
    #
    # Set up with:  west init -l boards && west update
    path: boards
    west-commands: ""
