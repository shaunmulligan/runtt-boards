# Every board runtt supports, and everything CI needs to know about each one.
#
# THIS FILE IS THE SOURCE OF TRUTH. The CI build list, the release notes table
# and the README's download table are all generated from it by scripts/boards.py,
# and `scripts/boards.py --check-readme` fails the build if the README has drifted.
#
# Before this existed the per-board asset list was written out three times, and
# three copies of a list that grows to dozens of boards will disagree eventually
# -- silently, as a board that builds but never gets published, or a README link
# to an asset that does not exist.
#
# ADDING A BOARD: append an entry, run `scripts/boards.py --write-readme`, and
# see docs/PORTING.md for the work that comes before that.
#
# Fields
#   id           Zephyr board target passed to `west build -b`. Must be one with
#                MCUboot slots -- see docs/PORTING.md.
#   name         What a human calls it, for tables.
#   soc          For grouping and for the hardware docs.
#   status       supported | in-progress. Only `supported` is built and published.
#   build        script + mode that produces the provisioning image.
#   provision    artefacts: source path in the build tree -> published asset name.
#   flash        how a user gets it onto the board (prose, for the tables).
#   probe        whether a debug probe is required.
#   notes        anything a user must know BEFORE flashing. Appears in the tables.
#   guide        the board's getting-started walkthrough; the README table links
#                the board name to it. Checked for existence at generation time.
#   program      the mechanics scripts/runtt-board uses to write a board:
#                  method        uf2 | swd
#                  volume_label  (uf2) the mass-storage label to look for
#                  bootsel_usb   (uf2) VID:PID when the board is in ROM loader mode
#                  target        (swd) pyocd target name
#                  backup        (swd) true when flashing destroys something
#                                unrecoverable, so a verified backup is required
#   identity     where the per-board identity record goes, so one image can be
#                given a name at provisioning time:
#                  offset        address of storage_partition. NOTE the RP2040
#                                value is XIP-mapped -- flash offset 0x1b0000
#                                appears at 0x101b0000 to the debugger and in a
#                                UF2 -- and getting that wrong writes 256 MB into
#                                nowhere and silently does nothing.

boards:
  - id: rpi_pico/rp2040/mcuboot
    guide: docs/start-rpi_pico.md
    name: Raspberry Pi Pico
    soc: RP2040
    status: supported
    build:
      script: scripts/build-pico.sh
      mode: provision
    provision:
      - from: build-pico-idle/provision.uf2
        as: provision-rpi_pico.uf2
    flash: Hold BOOTSEL, plug in, copy the file onto the drive that appears
    probe: false
    notes: Unbrickable — the RP2040 mask ROM always gives you BOOTSEL back
    program:
      method: uf2
      volume_label: RPI-RP2
      bootsel_usb: "2e8a:0003"
    identity:
      offset: 0x101b0000

  # All six checks in docs/PORTING.md pass on real hardware (2026-09-02):
  # describe reports the board and 2 channels; a deploy uploads, swaps and
  # confirms; logs reach container stdio; a deliberately unmanageable image
  # (CONFIG_MCUMGR_TRANSPORT_UART=n -- it boots, it just cannot be talked to)
  # fails to confirm and MCUboot reverts; the provisioning image flashed by
  # BOOTSEL drag-and-drop enumerates and reports itself freshly provisioned; and
  # unplugging exits non-zero ("lost contact with the device after 2
  # heartbeats"), so a restart policy fires.
  #
  # One note for whoever tests the unplug case again: halting the core over SWD
  # is NOT a substitute, and was tried. RP2350's USB device controller goes on
  # answering the host in hardware, so the device stays enumerated with the CPU
  # stopped and the runtime sees nothing wrong.
  #
  # Needs no new snippet files at all. The module's `/rpi_pico.*/` board regex
  # already matches (Zephyr anchors it against "$BOARD/$BOARD_QUALIFIERS"), and
  # the RP2040 .conf/.overlay are correct for RP2350: same `raspberrypi,pico-usbd`
  # driver, same `zephyr_udc0` label, also 16 bidirectional endpoints. Verified in
  # the linked ELF, not inferred from Kconfig.
  - id: rpi_pico2/rp2350a/m33/w/mcuboot
    guide: docs/start-rpi_pico2.md
    name: Raspberry Pi Pico 2 W
    soc: RP2350
    status: supported
    build:
      script: scripts/build-pico2w.sh
      mode: provision
    provision:
      - from: build-pico2w-idle/provision.uf2
        as: provision-rpi_pico2w.uf2
    flash: Hold BOOTSEL, plug in, copy the file onto the drive that appears
    probe: false
    notes: Unbrickable — the RP2350 boot ROM always gives BOOTSEL back
    program:
      method: uf2
      volume_label: RP2350
      bootsel_usb: "2e8a:000f"
    identity:
      # Same as RP2040, and not a copy-paste: RP2350's storage_partition is also
      # at 0x1b0000, and the XIP window is also 0x10000000. The unmapped 0x1b0000
      # writes nowhere and fails silently.
      offset: 0x101b0000

  - id: adafruit_feather_nrf52840/nrf52840
    guide: docs/start-adafruit_feather_nrf52840.md
    name: Adafruit Feather nRF52840
    soc: nRF52840
    status: supported
    build:
      script: scripts/build-feather.sh
      mode: provision
    provision:
      - from: build-feather-idle/mcuboot/zephyr/zephyr.hex
        as: provision-adafruit_feather_nrf52840-mcuboot.hex
      - from: build-feather-idle/provision-slot0.hex
        as: provision-adafruit_feather_nrf52840-slot0.hex
    flash: SWD, both files in order without resetting in between
    probe: true
    program:
      method: swd
      target: nrf52840
      backup: true
    identity:
      offset: 0xf8000
    notes: >-
      Back the board up first — this erases the Adafruit UF2 bootloader and its
      UICR settings, and there is no ROM loader to fall back on

  # Boards being brought up. Not built, not published, listed so the intent is
  # visible and nobody duplicates the work. Promote to `supported` once the
  # provisioning image has been flashed to real hardware and a deploy confirmed.
  - id: esp32s3_devkitc/esp32s3/procpu
    name: Waveshare ESP32-S3 (DevKitC-compatible)
    soc: ESP32-S3
    status: in-progress
    notes: >-
      Contract proven over the dual-CDC composite on USB-OTG: describe, logs to
      container stdio, and a deploy that uploads, swaps and confirms — four of
      the six PORTING.md checks. Outstanding: the unplug case, and a
      provisioning image on a factory-fresh board. See NOTES.md

  # All six checks in docs/PORTING.md pass on real hardware (2026-09-04), and
  # this board ran the deploy/logs/revert set over BOTH transports -- USB, and
  # SMP over ISO-TP on the physical CAN bus (MCP25625 to a BTT U2C at
  # 500 kbit/s, logs as raw frames on node+2). The revert was the first
  # exercised over CAN: a deploy of an image with its CAN transport disabled
  # went dark on the bus, the confirm deadline rebooted it, and MCUboot brought
  # the old image back confirmed -- manageable again 78 s after the deploy
  # started, no human involved. Pulling a bus wire mid-residency exits 1 after
  # two failed heartbeats, so a restart policy fires.
  #
  # One defect found during bring-up belonged to the module and is fixed there:
  # Zephyr's default ISO-TP receive pool (224 bytes) cannot hold an SMP upload
  # chunk, which the vcan gate never saw because the right sizing sat in this
  # repository's native-sim bring-up conf. See the module's Kconfig.
  #
  # The mcuboot variant is NOT upstream: this repository is a Zephyr BOARD_ROOT
  # (zephyr/module.yml) and boards/adafruit/... extends the upstream board with
  # the Pico 1's slot layout. Same offsets despite the 8 MB flash, so the
  # identity offset and make-provision-uf2 constants are the Pico's.
  - id: adafruit_feather_canbus_rp2040/rp2040/mcuboot
    guide: docs/start-adafruit_feather_canbus_rp2040.md
    name: Adafruit RP2040 CAN Bus Feather
    soc: RP2040 + MCP25625
    status: supported
    build:
      script: scripts/build-feather-can.sh
      mode: provision
    provision:
      - from: build-feather-can-idle/provision.uf2
        as: provision-adafruit_feather_canbus_rp2040.uf2
    flash: Hold BOOTSEL, plug in, copy the file onto the drive that appears
    probe: false
    notes: >-
      Unbrickable — the RP2040 mask ROM always gives you BOOTSEL back. The first
      board with both transports: dual-CDC USB and SMP over ISO-TP on CAN
      (500 kbit/s, node id from the identity record)
    program:
      method: uf2
      volume_label: RPI-RP2
      bootsel_usb: "2e8a:0003"
    identity:
      # The Pico 1's storage offset, deliberately: the mcuboot variant reuses
      # partitions_2M_sysbuild.dtsi wholesale, 8 MB flash notwithstanding.
      offset: 0x101b0000
