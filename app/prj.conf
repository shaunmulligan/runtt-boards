# The reference application.
#
# WHY THIS IS NOT idle/ -- the question looks like duplication and is not.
#
# The two have conflicting jobs. idle/ ships inside every provisioning image, so
# it is minimal and silent: one log line, then sleep forever. This one is the
# fixture the runtime's end-to-end gates run against, and those gates assert that
# application output reaches the log channel -- the CAN gate greps for a
# RECURRING line, because a raw CAN log channel has no backlog and a one-shot
# startup message would be a race against the listener attaching.
#
# So one must be quiet and small and the other must keep talking. A single
# application cannot be both, and a config flag switching between them would put
# the provisioning payload's size at the mercy of the test fixture's needs.
#
# Everything that makes this manageable by the runtime comes from the snippet
# (`-S runtt`), not from here. This file is what a customer's own
# application config would look like: ordinary, with no platform boilerplate.

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2560
