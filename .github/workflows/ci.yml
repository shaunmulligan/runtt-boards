name: CI

on:
  push:
  pull_request:

permissions:
  contents: write        # the release job needs it; nothing else does

env:
  ZEPHYR_SDK_VERSION: 1.0.1

jobs:
  # ---------------------------------------------------------------------------
  # NO CONTAINER, deliberately, and this is the second attempt.
  #
  # The first version ran in zephyrprojectrtos/ci and died pulling it: that image
  # carries a toolchain for every architecture Zephyr supports -- about
  # thirty-five of them, xtensa and hexagon and tricore included -- and comes to
  # ~33 GB, more than a GitHub-hosted runner has free.
  #
  # This project needs exactly two toolchains: arm-zephyr-eabi for the nRF52840
  # and RP2040, and the host compiler for native_sim. `west sdk install -t` fetches
  # just that one, which is 2 GB rather than 33, and caches.
  # ---------------------------------------------------------------------------
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out this repo as the manifest repo
        uses: actions/checkout@v4
        with:
          path: boards          # must match `self.path` in west.yml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install west and build tools
        run: |
          pip install --quiet west pyelftools cryptography intelhex click cbor2 jsonschema
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build device-tree-compiler

      # Keyed on the manifest, because that is what decides the contents. The
      # module is tracked by branch, so a warm cache can be stale by one commit --
      # `west update` runs regardless and is cheap when nothing moved.
      - name: Cache the west workspace
        uses: actions/cache@v4
        with:
          path: |
            zephyr
            modules
            bootloader
            .west
          key: west-${{ hashFiles('boards/west.yml') }}

      - name: Assemble the workspace
        run: |
          west init -l boards 2>/dev/null || echo "already initialised"
          west update --narrow -o=--depth=1
          west list
          pip install --quiet -r zephyr/scripts/requirements-base.txt

      # 2 GB for the one toolchain we need. The SDK is versioned, so the key can
      # be exact and the cache never goes stale silently.
      - name: Cache the Zephyr SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          key: zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}-arm

      - name: Install the ARM toolchain only
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          west sdk install \
            --version "${ZEPHYR_SDK_VERSION}" \
            --install-base "${GITHUB_WORKSPACE}" \
            -t arm-zephyr-eabi
          du -sh "zephyr-sdk-${ZEPHYR_SDK_VERSION}"

      - name: Point Zephyr at it
        run: echo "ZEPHYR_SDK_INSTALL_DIR=${GITHUB_WORKSPACE}/zephyr-sdk-${ZEPHYR_SDK_VERSION}" >> "$GITHUB_ENV"

      # native_sim needs no SDK and is the fixture the runtime's gates consume, so
      # it goes first: if this breaks, runtt's CI is about to break too.
      - name: Build native_sim
        working-directory: boards
        run: ./scripts/build-native-sim.sh

      - name: Build native_sim with CAN
        working-directory: boards
        env:
          BUILD_DIR: ${{ github.workspace }}/boards/build-can
        run: |
          ./scripts/build-native-sim.sh \
            -DEXTRA_CONF_FILE="$PWD/bringup/native-sim-can.conf" \
            -DEXTRA_DTC_OVERLAY_FILE="$PWD/bringup/native-sim-can.overlay"

      - name: The module's contract assertion
        run: ./modules/runtt/tests/contract_version.sh

      - name: Build for the Pico (RP2040), full contract
        working-directory: boards
        run: ./scripts/build-pico.sh mcuboot

      - name: Build for the Feather (nRF52840), full contract
        working-directory: boards
        run: ./scripts/build-feather.sh mcuboot

      # Driven by boards.yml, so adding a board does not mean editing this file.
      - name: Provisioning images, every supported board
        working-directory: boards
        run: |
          set -euo pipefail
          ./scripts/boards.py --build-plan | while read -r script mode; do
            echo "=== $script $mode ==="
            "./$script" "$mode"
          done

      # The contract is in the ARTEFACT, not the config -- and this repo is where
      # that mattered. build-feather.sh spent a long time passing a snippet flag
      # naming an image that no longer existed; sysbuild ignores that silently and
      # exits zero, so this workflow was green while building Feather firmware
      # with no SMP server, no USB descriptors and no runtt module in it at all.
      # Every source-level check passed, because the source was fine.
      #
      # So read the linked ELF. Keyed off CONFIG_RUNTT_USB rather than a path
      # glob, which covers application images of USB targets and skips MCUboot
      # (no USB contract by design) and native_sim (ptys, not USB).
      #
      # This repo builds the images people actually flash, so it is the last
      # place that should be taking the build's word for it.
      - name: The contract is in the built images, not just the config
        working-directory: boards
        run: |
          set -euo pipefail
          shopt -s nullglob
          checked=0
          for cfg in build*/*/zephyr/.config build*/zephyr/.config; do
            grep -q "^CONFIG_RUNTT_USB=y" "$cfg" || continue
            elf="$(dirname "$cfg")/zephyr.elf"
            [ -f "$elf" ] || { echo "::error::$cfg enables USB but $elf is missing"; exit 1; }
          # strings(1) into a file, then grep the FILE. Not `strings ... | grep -q`:
          # grep -q exits on the first match and closes the pipe, strings dies of
          # SIGPIPE, and under `set -o pipefail` the pipeline reports failure
          # BECAUSE the descriptor was found. That inverts this check -- it passes
          # only when the contract is missing. Caught by running it with pipefail
          # on, having written it and tested it without.
            syms="$(mktemp)"
            strings "$elf" > "$syms"
            for iface in runtt-mgmt runtt-log; do
              if grep -qx "$iface" "$syms"; then
                echo "  $elf: $iface"
              else
                echo "::error::$elf enables RUNTT_USB but lacks the $iface descriptor"
                exit 1
              fi
            done
            rm -f "$syms"
            checked=$((checked + 1))
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::no USB application image was found to check. Either nothing"
            echo "::error::built, or the snippet reached none of them -- which is exactly"
            echo "::error::the silent failure this step exists to catch."
            exit 1
          fi
          echo "checked $checked USB application image(s)"

      - name: Collect artefacts
        working-directory: boards
        run: |
          set -euo pipefail
          mkdir -p out
          cp build-pico-idle/provision.uf2          out/provision-rpi_pico.uf2
          cp build-feather-idle/provision-slot0.hex out/provision-adafruit_feather_nrf52840-slot0.hex
          cp build-feather-idle/mcuboot/zephyr/zephyr.hex \
             out/provision-adafruit_feather_nrf52840-mcuboot.hex
          # Fixtures for runtt's end-to-end gates. Its tests need a firmware
          # BINARY, not firmware source, which is what lets that repo carry no
          # Zephyr toolchain at all.
          ( cd out && sha256sum * > SHA256SUMS )
          ls -la out
          # native_sim binaries are NOT release assets. A release is what a user
          # lands on to flash a board, and two host executables they have no use
          # for is noise on that page. They go up as build artefacts, where
          # anyone debugging a run can still get them.
          mkdir -p fixtures
          cp build/zephyr/zephyr.exe      fixtures/native_sim-runtt.exe
          cp build-can/zephyr/zephyr.exe  fixtures/native_sim-runtt-can.exe
          ( cd fixtures && sha256sum * > SHA256SUMS )

      # Artefact names say "ci-" because GitHub ZIPS every artefact and offers no
      # way to pull one file out of the archive. So this is CI plumbing and a
      # debugging aid, NOT the download path -- mistaking the two is easy, since
      # a run page shows `provisioning-images.zip` and looks like the deliverable.
      #
      # The download path is a RELEASE, where each file is its own asset with its
      # own URL. That is what the README links point at.
      - name: Upload provisioning images (CI plumbing; releases are the download path)
        uses: actions/upload-artifact@v4
        with:
          name: ci-provisioning-images
          path: boards/out/
          retention-days: 14

      - name: Upload native_sim fixtures
        uses: actions/upload-artifact@v4
        with:
          name: ci-native-sim-fixtures
          path: boards/fixtures/
          retention-days: 14

  # boards.yml is the source of truth; this is what makes that true rather than
  # aspirational. A generator you have to remember to run is just a third copy.
  manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml
      - name: boards.yml is valid, and its derived copies match
        run: |
          ./scripts/boards.py --build-plan
          ./scripts/boards.py --check-readme
          ./scripts/boards.py --check-json

      # The single-file path must keep working on a machine with no pyyaml. That
      # is the whole point of boards.json, and it is easy to break by adding an
      # import, so prove it rather than assume it.
      - name: runtt-board works without a YAML parser
        run: |
          mkdir -p /tmp/blocker
          printf 'raise ImportError("simulated: no pyyaml")\n' > /tmp/blocker/yaml.py
          PYTHONPATH=/tmp/blocker ./scripts/runtt-board list

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning --exclude=SC1091 scripts/*.sh

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [firmware, shellcheck, manifest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ci-provisioning-images
          path: out

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la out
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Provisioning images for every supported board, built from \`${GITHUB_SHA}\`.

          **Flash one of these once per board.** After that every update is remote:
          the board becomes a container image you deploy with
          [runtt](https://github.com/shaunmulligan/runtt).

          | Board | Download | How to flash |
          |---|---|---|
          | **Raspberry Pi Pico** (RP2040) | \`provision-rpi_pico.uf2\` | Hold BOOTSEL, plug in, copy the file onto the drive that appears. **No debug probe needed.** |
          | **Adafruit Feather nRF52840** | \`provision-adafruit_feather_nrf52840-mcuboot.hex\` and \`provision-adafruit_feather_nrf52840-slot0.hex\` | Needs SWD. **Back the board up first** — this erases the Adafruit bootloader. See [PROVISIONING.md](https://github.com/shaunmulligan/runtt-boards/blob/main/docs/PROVISIONING.md) |

          Verify what you downloaded against \`SHA256SUMS\`.

          ⚠️ Signed with MCUboot's **published development key**, so no trust root is
          enrolled and image signatures prove nothing. Fine for a bench; generate
          your own key before a fleet.
          " \
            out/* || gh release upload "${GITHUB_REF_NAME}" out/* --clobber
